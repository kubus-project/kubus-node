services:
  kubo:
    image: ipfs/kubo:v0.43.0
    command: ["daemon", "--migrate=true", "--agent-version-suffix=kubus-node"]
    environment:
      IPFS_TELEMETRY: "off"
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - kubo-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  kubus-node-agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      IPFS_RPC_URL: http://kubo:5001
      IPFS_GATEWAY_URL: http://127.0.0.1:8080
      LOCAL_STATE_PATH: /var/lib/kubus-node/state.json
      LOCAL_DATA_PATH: /var/lib/kubus-node/data
      LOCAL_API_ENABLED: ${LOCAL_API_ENABLED:-true}
      LOCAL_API_HOST: ${LOCAL_API_HOST:-0.0.0.0}
      LOCAL_API_PORT: ${LOCAL_API_PORT:-8787}
      LOCAL_API_ALLOW_LAN: ${LOCAL_API_ALLOW_LAN:-false}
      LOCAL_API_PUBLIC_URL: ${LOCAL_API_PUBLIC_URL:-}
      LOCAL_API_LAN_URL: ${LOCAL_API_LAN_URL:-}
      LOCAL_API_REMOTE_URL: ${LOCAL_API_REMOTE_URL:-}
      LOCAL_API_TRUSTED_PROXY_ADDRESSES: ${LOCAL_API_TRUSTED_PROXY_ADDRESSES:-}
      SPATIAL_WORKER_URL: ${SPATIAL_WORKER_URL:-http://kubus-spatial-worker:8790}
      WORKER_AUTH_KEY_PATH: /var/lib/kubus-node/worker-auth.key
      NODE_GUI_ENABLED: ${NODE_GUI_ENABLED:-true}
      NODE_GUI_HOST: ${NODE_GUI_HOST:-0.0.0.0}
      NODE_GUI_PORT: ${NODE_GUI_PORT:-8787}
      NODE_GUI_TOKEN: ${NODE_GUI_TOKEN:-}
      NODE_GUI_ALLOW_REMOTE: ${NODE_GUI_ALLOW_REMOTE:-false}
      NODE_GUI_DISPLAY_URL: ${NODE_GUI_DISPLAY_URL:-http://my.node.kubus.site:8787/gui}
      OFFER_REMOTE_COMPUTE: ${OFFER_REMOTE_COMPUTE:-false}
      REMOTE_COMPUTE_PAUSED: ${REMOTE_COMPUTE_PAUSED:-false}
      REMOTE_COMPUTE_MAX_CONCURRENCY: ${REMOTE_COMPUTE_MAX_CONCURRENCY:-1}
      REMOTE_COMPUTE_MAX_QUEUE_DEPTH: ${REMOTE_COMPUTE_MAX_QUEUE_DEPTH:-2}
      REMOTE_COMPUTE_MAX_INPUT_BYTES: ${REMOTE_COMPUTE_MAX_INPUT_BYTES:-21474836480}
      REMOTE_COMPUTE_MINIMUM_FREE_VRAM_BYTES: ${REMOTE_COMPUTE_MINIMUM_FREE_VRAM_BYTES:-2147483648}
      PARTICIPATION_GRACE_MS: ${PARTICIPATION_GRACE_MS:-900000}
    depends_on:
      kubo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - node-state:/var/lib/kubus-node
    healthcheck:
      test: ["CMD", "node", "dist/src/index.js", "status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  kubus-spatial-worker:
    profiles: ["spatial"]
    build:
      context: ./spatial-worker
    environment:
      KUBUS_SPATIAL_MAX_ITERATIONS: ${KUBUS_SPATIAL_MAX_ITERATIONS:-15000}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WORKER_AUTH_KEY_PATH: /var/lib/kubus-node/worker-auth.key
    volumes:
      - node-state:/var/lib/kubus-node
    expose:
      - "8790"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  kubo-data:
  node-state:

# Production notes:
# - Do not expose Kubo RPC port 5001 to the host or public internet.
# - Gateway port 8080 is loopback-bound for local verification only.
# - The GUI binds to 0.0.0.0 inside the container so Docker can publish it.
# - The host port is still loopback-bound at 127.0.0.1:8787, and NODE_GUI_TOKEN is required.
# - my.node.kubus.site is only a hosts-file alias to 127.0.0.1.
# - Swarm port 4001 can be exposed when operators intend to participate in public IPFS routing.
