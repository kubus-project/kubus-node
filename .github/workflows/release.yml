name: Release kubus Node

on:
  push:
    tags: ['v*']

concurrency:
  group: kubus-node-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  source-gate:
    name: Source and version gate
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --tags --force
          source_sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          event_source_sha="$(git rev-parse "${GITHUB_SHA}^{}")"
          test "$source_sha" = "$event_source_sha"
          git merge-base --is-ancestor "$source_sha" origin/master
          version="$(node -p "require('./package.json').version")"
          test "$version" = "$(node -p "require('./version.json').version")"
          test "${GITHUB_REF_NAME}" = "v$version"
          channel="$(node -p "require('./version.json').channel")"
          if [[ "$version" == *-alpha.* ]]; then test "$channel" = alpha; prerelease=true;
          elif [[ "$version" == *-beta.* ]]; then test "$channel" = beta; prerelease=true;
          else test "$channel" = stable; prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  verify:
    name: Full release validation
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: git diff --exit-code -- package-lock.json
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: git diff --check
      - run: docker compose config
      - run: docker compose build kubus-node-agent kubus-spatial-worker

  images:
    name: Build and push immutable images
    needs: [source-gate, verify]
    runs-on: ubuntu-24.04
    outputs:
      node_digest: ${{ steps.node-build.outputs.digest }}
      worker_digest: ${{ steps.worker-build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: node-meta
        with:
          images: ghcr.io/kubus-project/kubus-node
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ contains(github.ref_name, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: node-build
        with:
          context: .
          push: true
          tags: ${{ steps.node-meta.outputs.tags }}
          labels: ${{ steps.node-meta.outputs.labels }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: worker-meta
        with:
          images: ghcr.io/kubus-project/kubus-spatial-worker
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ contains(github.ref_name, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: worker-build
        with:
          context: spatial-worker
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}

  package:
    name: Package exact published images
    needs: [source-gate, images]
    uses: ./.github/workflows/node-package.yml
    with:
      source_sha: ${{ needs.source-gate.outputs.source_sha }}
      release_tag: ${{ github.ref_name }}
      publish: true
      node_image: ghcr.io/kubus-project/kubus-node@${{ needs.images.outputs.node_digest }}
      worker_image: ghcr.io/kubus-project/kubus-spatial-worker@${{ needs.images.outputs.worker_digest }}

  publish:
    name: Publish tested release artifacts
    needs: [source-gate, images, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubus-node-release-package-${{ github.ref_name }}
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          registry-url: https://registry.npmjs.org
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/kubus-project/kubus-node@${{ needs.images.outputs.node_digest }}
          format: spdx-json
          output-file: release/kubus-node-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/kubus-project/kubus-spatial-worker@${{ needs.images.outputs.worker_digest }}
          format: spdx-json
          output-file: release/kubus-spatial-worker-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksum the exact tested artifacts and SBOMs
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum *.zip *.tar.gz *.spdx.json kubus-node-release-manifest-*.json npm/*.tgz > SHA256SUMS)
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          prerelease: ${{ needs.source-gate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.tar.gz
            release/npm/*.tgz
            release/SHA256SUMS
            release/*.spdx.json
            release/kubus-node-release-manifest-*.json
      - name: Publish the exact tested npm package with its channel dist-tag
        shell: bash
        env:
          CHANNEL: ${{ needs.source-gate.outputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in alpha) tag=edge;; beta) tag=beta;; stable) tag=latest;; *) exit 1;; esac
          tarball="$(find release/npm -maxdepth 1 -name '@kubus-kubus-node-*.tgz' -print -quit)"
          test -n "$tarball"
          npm publish "$tarball" --access public --provenance --tag "$tag"
