name: Release kubus Node

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: node-meta
        with:
          images: ghcr.io/kubus-project/kubus-node
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ contains(github.ref_name, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: node-build
        with:
          context: .
          push: true
          tags: ${{ steps.node-meta.outputs.tags }}
          labels: ${{ steps.node-meta.outputs.labels }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: worker-meta
        with:
          images: ghcr.io/kubus-project/kubus-spatial-worker
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ contains(github.ref_name, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: worker-build
        with:
          context: spatial-worker
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
      - name: Build release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/kubus-node-${GITHUB_REF_NAME}
          cp docker-compose.yml .env.example release/kubus-node-${GITHUB_REF_NAME}/
          cp -R docs release/kubus-node-${GITHUB_REF_NAME}/docs
          cp README.md version.json release/kubus-node-${GITHUB_REF_NAME}/
          tar -C release -czf release/kubus-node-${GITHUB_REF_NAME}.tar.gz kubus-node-${GITHUB_REF_NAME}
          (cd release && sha256sum kubus-node-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS)
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/kubus-project/kubus-node@${{ steps.node-build.outputs.digest }}
          format: spdx-json
          output-file: release/kubus-node-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/kubus-project/kubus-spatial-worker@${{ steps.worker-build.outputs.digest }}
          format: spdx-json
          output-file: release/kubus-spatial-worker-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Add SBOM checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum *.spdx.json >> SHA256SUMS)
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/kubus-node-${{ github.ref_name }}.tar.gz
            release/SHA256SUMS
            release/*.spdx.json
