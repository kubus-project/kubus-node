name: Pull request validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: kubus-node-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: git diff --exit-code -- package-lock.json
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Spatial bundles against a real, disposable Kubo
        shell: bash
        run: |
          # The unit suites fake Kubo. This one starts the pinned release in a
          # throwaway repository (offline, loopback only) and checks the facts
          # those fakes assume: file stats, ranged reads inside a bundle,
          # recursive pins and what garbage collection keeps. The archive is
          # verified against the checksum published with the release.
          set -euo pipefail
          version=v0.43.0
          archive="kubo_${version}_linux-amd64.tar.gz"
          base="https://github.com/ipfs/kubo/releases/download/${version}"
          mkdir -p "$RUNNER_TEMP/kubo"
          cd "$RUNNER_TEMP/kubo"
          curl --fail --silent --show-error --location --retry 3 -O "${base}/${archive}"
          curl --fail --silent --show-error --location --retry 3 -O "${base}/${archive}.sha512"
          sha512sum --check "${archive}.sha512"
          tar -xzf "$archive"
          cd "$GITHUB_WORKSPACE"
          KUBUS_TEST_KUBO_BIN="$RUNNER_TEMP/kubo/kubo/ipfs" npm test -- --run tests/spatialKubo.integration.test.ts
      - run: npm audit --audit-level=high
      - run: git diff --check

  docker-runtime:
    name: Docker runtime and bootstrap smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - name: Validate Compose and build both runtime images
        run: |
          docker compose config
          docker compose build kubus-node-agent kubus-spatial-worker
      - name: Boot the unconfigured runtime and assert local-only setup
        shell: bash
        run: |
          set -euo pipefail
          project="kubus-node-ci-${GITHUB_RUN_ID}"
          trap 'docker compose -p "$project" down --volumes --remove-orphans' EXIT
          docker compose -p "$project" up -d kubo kubus-node-agent
          for attempt in {1..80}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/setup >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose -p "$project" logs --no-color
          exit 1
      - name: Exercise retrieval classification against a real Kubo daemon
        shell: bash
        run: |
          set -euo pipefail
          container="kubus-retrieval-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --name "$container" -p 5099:5001 -p 8099:8080 ipfs/kubo:v0.43.0 daemon --migrate=true
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:8099/webui >/dev/null; then break; fi
            sleep 2
          done
          KUBUS_TEST_KUBO_RPC=http://127.0.0.1:5099 KUBUS_TEST_KUBO_GATEWAY=http://127.0.0.1:8099 npm test -- --run tests/retrievalField.integration.test.ts

  package:
    name: Package
    uses: ./.github/workflows/node-package.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      publish: false

  windows-installer-contract:
    name: Windows installer contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: npm
      - name: Install and build the packaged CLI entrypoint
        shell: pwsh
        run: |
          npm ci
          npm run build
      - name: Exercise the launcher browser handoff on Windows PowerShell
        shell: pwsh
        run: npm test -- tests/windowsGuiHandoff.test.ts
      - name: Run the installer's runtime.env and GPU-worker logic on Windows PowerShell 5.1
        shell: pwsh
        env:
          # The installer ships to, and runs on, Windows PowerShell 5.1. These
          # extract its real functions by AST and require the TypeScript's answers.
          KUBUS_TEST_PWSH: powershell.exe
        run: npm test -- tests/windowsInstallerEnv.test.ts
      - name: Parse installer and verify shipped-layout references
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("installer/windows/KubusNodeSetup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $installer = Get-Content -Raw installer/windows/KubusNodeSetup.ps1
          if ($installer -notmatch 'docker-compose.release.yml') { throw 'Installer does not reference release compose.' }
          if ($installer -match '(?<![A-Za-z])--build(?![A-Za-z])') { throw 'Installer must not build from source.' }
          if (-not (Test-Path installer/windows/Start-KubusNodeSetup.cmd)) { throw 'Windows launcher missing.' }
          if (-not (Test-Path docker-compose.release.template.yml)) { throw 'Release compose template missing.' }
      - name: Validate Windows package layout
        shell: pwsh
        run: |
          $digest = 'sha256:' + ('0' * 64)
          # Derived, not hardcoded: a pinned literal silently stops matching the
          # moment version.json is bumped, and this job then fails for reasons
          # that have nothing to do with the change under review.
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).version
          node scripts/build_release_package.mjs --output release-contract --node-image "ghcr.io/kubus-project/kubus-node@$digest" --worker-image "ghcr.io/kubus-project/kubus-spatial-worker@$digest"
          node scripts/verify_release_package.mjs --directory "release-contract/kubus-node-windows-v$version" --version $version
      - name: Install the exact npm tarball and exercise the installed CLI
        shell: pwsh
        run: |
          $digest = 'sha256:' + ('0' * 64)
          node scripts/build_npm_package.mjs --output npm-contract --node-image "ghcr.io/kubus-project/kubus-node@$digest" --worker-image "ghcr.io/kubus-project/kubus-spatial-worker@$digest"
          $tarball = Get-ChildItem npm-contract -Filter *.tgz | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tarball) { throw 'npm package tarball missing.' }
          node scripts/verify_npm_package.mjs --tarball $tarball

  spatial-worker:
    name: Spatial worker with the pinned tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned derivative tools exactly as the worker image does
        shell: bash
        run: |
          # The worker's tests run Niantic's spz and Spark's build-lod on a
          # synthetic master and check their output independently. The pins are
          # read from the Dockerfile, so the tools under test cannot drift from
          # the ones the image ships. No CUDA is needed: reconstruction (ns-train)
          # is not covered here and needs a real GPU.
          set -euo pipefail
          pin() { sed -n "s/^ARG $1=\(.*\)\$/\1/p" spatial-worker/Dockerfile | head -n1; }
          spark_ref="$(pin SPARK_REF)"; spz_ref="$(pin SPZ_REF)"; rust="$(pin RUST_TOOLCHAIN)"
          test -n "$spark_ref" -a -n "$spz_ref" -a -n "$rust"
          tools="$RUNNER_TEMP/tools"; mkdir -p "$tools"
          git init "$tools/spark"
          git -C "$tools/spark" remote add origin https://github.com/sparkjsdev/spark.git
          git -C "$tools/spark" fetch --depth 1 origin "$spark_ref"
          git -C "$tools/spark" checkout --detach FETCH_HEAD
          test "$(git -C "$tools/spark" rev-parse HEAD)" = "$spark_ref"
          rustup toolchain install "$rust" --profile minimal
          (cd "$tools/spark/rust" && cargo +"$rust" build --release --locked -p build-lod --no-default-features)
          python3 -m venv "$tools/venv"
          "$tools/venv/bin/python" -m pip install --quiet numpy==2.5.3 pytest==9.1.1 httpx==0.28.1 fastapi==0.141.1 scikit-build-core nanobind python_devtools
          CMAKE_ARGS="-DCMAKE_POSITION_INDEPENDENT_CODE=ON" "$tools/venv/bin/python" -m pip install --quiet --no-build-isolation "git+https://github.com/nianticlabs/spz.git@${spz_ref}"
          printf '{"buildLod":{"version":"spark-v2.1.0","ref":"%s"},"spz":{"version":"v3.0.0","ref":"%s"}}\n' "$spark_ref" "$spz_ref" > "$tools/tools.json"
          {
            echo "KUBUS_BUILD_LOD=$tools/spark/rust/target/release/build-lod"
            echo "KUBUS_TOOLS_MANIFEST=$tools/tools.json"
            echo "KUBUS_REQUIRE_REAL_TOOLS=1"
            echo "WORKER_PYTHON=$tools/venv/bin/python"
          } >> "$GITHUB_ENV"
      - name: Worker tests (a skipped real-tool test fails the run)
        shell: bash
        run: |
          set -euo pipefail
          cd spatial-worker
          "$WORKER_PYTHON" -m pytest -q -rs

  pr-validation-required:
    name: PR validation required
    runs-on: ubuntu-24.04
    needs: [quality, docker-runtime, package, windows-installer-contract, spatial-worker]
    if: always()
    steps:
      - name: Require every declared job to pass or be legitimately skipped
        shell: bash
        run: |
          set -euo pipefail
          for result in "${{ needs.quality.result }}" "${{ needs.docker-runtime.result }}" "${{ needs.package.result }}" "${{ needs.windows-installer-contract.result }}" "${{ needs.spatial-worker.result }}"; do
            test "$result" = success -o "$result" = skipped || { echo "Required validation result: $result"; exit 1; }
          done
